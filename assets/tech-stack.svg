<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 306" width="900" height="306" fill="none" role="img" aria-label="Tech stack as code">
  <defs>
    <clipPath id="win"><rect width="900" height="306" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#win)" font-family="'Courier New', monospace" font-size="15">
    <!-- editor body -->
    <rect width="900" height="306" fill="#0d1117"/>

    <!-- title bar -->
    <rect width="900" height="40" fill="#161b22"/>
    <circle cx="26" cy="20" r="6" fill="#ff5f56"/>
    <circle cx="48" cy="20" r="6" fill="#ffbd2e"/>
    <circle cx="70" cy="20" r="6" fill="#27c93f"/>
    <!-- active tab -->
    <rect x="100" y="0" width="186" height="40" fill="#0d1117"/>
    <rect x="100" y="0" width="186" height="2" fill="#58a6ff"/>
    <text x="193" y="25" text-anchor="middle" fill="#c9d1d9" font-size="13.5">youssef.stack.js</text>
    <line x1="0" y1="40" x2="900" y2="40" stroke="#30363d" stroke-width="1"/>

    <!-- gutter -->
    <g fill="#6e7681" text-anchor="end">
      <text x="42" y="70">1</text>
      <text x="42" y="96">2</text>
      <text x="42" y="122">3</text>
      <text x="42" y="148">4</text>
      <text x="42" y="174">5</text>
      <text x="42" y="200">6</text>
      <text x="42" y="226">7</text>
      <text x="42" y="252">8</text>
      <text x="42" y="278">9</text>
    </g>

    <!-- code -->
    <g>
      <text x="60" y="70" fill="#8b949e">// tech stack — what I build with</text>

      <text x="60" y="96"><tspan fill="#ff7b72">const</tspan><tspan fill="#ffa657"> youssef</tspan><tspan fill="#ff7b72"> = </tspan><tspan fill="#c9d1d9">{</tspan></text>

      <text x="78" y="122"><tspan fill="#79c0ff">frontend</tspan><tspan fill="#c9d1d9">: [</tspan><tspan fill="#a5d6ff">'React'</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#a5d6ff">'Next.js'</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#a5d6ff">'TailwindCSS'</tspan><tspan fill="#c9d1d9">,</tspan></text>

      <text x="177" y="148"><tspan fill="#a5d6ff">'Blade'</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#a5d6ff">'JavaScript'</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#a5d6ff">'HTML'</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#a5d6ff">'CSS'</tspan><tspan fill="#c9d1d9">],</tspan></text>

      <text x="78" y="174"><tspan fill="#79c0ff">backend</tspan><tspan fill="#c9d1d9">:  [</tspan><tspan fill="#a5d6ff">'PHP'</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#a5d6ff">'Laravel'</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#a5d6ff">'Node.js'</tspan><tspan fill="#c9d1d9">],</tspan></text>

      <text x="78" y="200"><tspan fill="#79c0ff">database</tspan><tspan fill="#c9d1d9">: [</tspan><tspan fill="#a5d6ff">'PostgreSQL'</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#a5d6ff">'MongoDB'</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#a5d6ff">'MySQL'</tspan><tspan fill="#c9d1d9">],</tspan></text>

      <text x="78" y="226"><tspan fill="#79c0ff">devops</tspan><tspan fill="#c9d1d9">:   [</tspan><tspan fill="#a5d6ff">'Docker'</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#a5d6ff">'Ubuntu'</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#a5d6ff">'Git'</tspan><tspan fill="#c9d1d9">,</tspan></text>

      <text x="177" y="252"><tspan fill="#a5d6ff">'GitHub'</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#a5d6ff">'Bitbucket'</tspan><tspan fill="#c9d1d9">],</tspan></text>

      <text x="60" y="278" fill="#c9d1d9">};</text>
    </g>

    <!-- blinking cursor -->
    <rect x="80" y="264" width="9" height="18" fill="#58a6ff">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- window border -->
    <rect x="0.5" y="0.5" width="899" height="305" rx="12" fill="none" stroke="#30363d" stroke-width="1.5"/>
  </g>
</svg>
