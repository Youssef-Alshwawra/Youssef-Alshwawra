<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 300" width="900" height="300" fill="none" role="img" aria-label="Youssef Al-Shwawra — Full-Stack Developer">
  <defs>
    <!-- animated shimmer gradient for the name -->
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="220" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#56d4dd"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 220 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a371f7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#21262d"/>
    </pattern>

    <filter id="ng" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="card"><rect x="0" y="0" width="900" height="300" rx="18"/></clipPath>
    <clipPath id="typeClip">
      <rect x="70" y="178" width="0" height="34">
        <animate attributeName="width" values="0;320" dur="1.4s" begin="1.6s" fill="freeze" calcMode="linear"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <!-- backdrop -->
    <rect width="900" height="300" fill="#0d1117"/>
    <rect width="900" height="300" fill="url(#dots)"/>

    <!-- animated glow blobs -->
    <ellipse cx="760" cy="120" rx="240" ry="200" fill="url(#glowBlue)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="760;700;760" dur="12s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="120" cy="260" rx="220" ry="180" fill="url(#glowPurple)">
      <animate attributeName="opacity" values="0.5;0.85;0.5" dur="7s" repeatCount="indefinite"/>
    </ellipse>

    <!-- floating particles -->
    <g fill="#58a6ff">
      <circle cx="540" cy="250" r="2.5" opacity="0.6">
        <animate attributeName="cy" values="250;60" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.7;0" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="610" cy="280" r="2" opacity="0.5" fill="#a371f7">
        <animate attributeName="cy" values="280;80" dur="11s" begin="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.6;0" dur="11s" begin="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="470" cy="270" r="1.8" opacity="0.5" fill="#56d4dd">
        <animate attributeName="cy" values="270;90" dur="10s" begin="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.6;0" dur="10s" begin="4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- right-side orbital decoration -->
    <g>
      <circle cx="745" cy="150" r="98" fill="none" stroke="#21262d" stroke-width="1.5" stroke-dasharray="2 13">
        <animateTransform attributeName="transform" type="rotate" from="360 745 150" to="0 745 150" dur="34s" repeatCount="indefinite"/>
      </circle>
      <circle cx="745" cy="150" r="70" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="6 11">
        <animateTransform attributeName="transform" type="rotate" from="0 745 150" to="360 745 150" dur="24s" repeatCount="indefinite"/>
      </circle>
      <circle r="4.5" fill="#58a6ff">
        <animateMotion dur="6s" repeatCount="indefinite" path="M745,80 a70,70 0 1,1 0,140 a70,70 0 1,1 0,-140"/>
      </circle>
      <circle r="3" fill="#a371f7">
        <animateMotion dur="9s" repeatCount="indefinite" rotate="auto" path="M745,52 a98,98 0 1,0 0,196 a98,98 0 1,0 0,-196"/>
      </circle>
      <text x="745" y="167" text-anchor="middle" font-family="'Courier New', monospace" font-size="46" font-weight="700" fill="#58a6ff" filter="url(#ng)">&lt;/&gt;
        <animate attributeName="opacity" values="0.85;0.5;0.85" dur="3s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- left text block -->
    <!-- kicker -->
    <text x="72" y="78" font-family="'Courier New', monospace" font-size="15" letter-spacing="5" fill="#8b949e" opacity="0">
      &gt; HELLO, I'M
      <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.1s" fill="freeze"/>
    </text>

    <!-- name -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.3s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 16" to="0 0" dur="0.8s" begin="0.3s" fill="freeze"/>
      <text x="70" y="142" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="url(#shine)" filter="url(#ng)">Youssef Al-Shwawra</text>
    </g>

    <!-- animated underline -->
    <line x1="73" y1="160" x2="545" y2="160" stroke="url(#shine)" stroke-width="3" stroke-linecap="round" stroke-dasharray="472" stroke-dashoffset="472">
      <animate attributeName="stroke-dashoffset" from="472" to="0" dur="1.1s" begin="0.7s" fill="freeze"/>
    </line>

    <!-- typed subtitle -->
    <g clip-path="url(#typeClip)">
      <text x="70" y="204" font-family="'Courier New', monospace" font-size="26" font-weight="700" fill="#58a6ff">Full-Stack Developer</text>
    </g>
    <rect x="70" y="182" width="2.5" height="28" fill="#56d4dd">
      <animate attributeName="x" values="70;390" dur="1.4s" begin="1.6s" fill="freeze" calcMode="linear"/>
      <animate attributeName="opacity" values="1;1;0;0;1;1" dur="1s" begin="3s" repeatCount="indefinite"/>
    </rect>

    <!-- university line -->
    <text x="72" y="236" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e" opacity="0">
      Software Engineering @ Al-Zaytoonah University of Jordan
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="3s" fill="freeze"/>
    </text>

    <!-- tech chips -->
    <g font-family="'Courier New', monospace" font-size="13" fill="#c9d1d9" text-anchor="middle">
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="3.2s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" dur="0.5s" begin="3.2s" fill="freeze"/>
        <rect x="72" y="256" width="80" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
        <text x="112" y="273">Node.js</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="3.4s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" dur="0.5s" begin="3.4s" fill="freeze"/>
        <rect x="160" y="256" width="92" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
        <text x="206" y="273">ASP.NET</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="3.6s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" dur="0.5s" begin="3.6s" fill="freeze"/>
        <rect x="260" y="256" width="68" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
        <text x="294" y="273">React</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="3.8s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" dur="0.5s" begin="3.8s" fill="freeze"/>
        <rect x="336" y="256" width="108" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
        <text x="390" y="273">SQL / NoSQL</text>
      </g>
    </g>

    <!-- card border -->
    <rect x="0.5" y="0.5" width="899" height="299" rx="18" fill="none" stroke="#30363d" stroke-width="1.5"/>
  </g>
</svg>
