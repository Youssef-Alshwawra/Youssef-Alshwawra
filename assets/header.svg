<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" fill="none" role="img" aria-label="Youssef Al-Shwawra — Full-Stack Developer">
  <defs>
    <radialGradient id="softGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.3" fill="#1c2128"/>
    </pattern>

    <clipPath id="card"><rect x="0" y="0" width="900" height="300" rx="16"/></clipPath>
    <clipPath id="typeClip">
      <rect x="70" y="178" width="0" height="34">
        <animate attributeName="width" values="0;320" dur="1.3s" begin="1.5s" fill="freeze" calcMode="linear"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <!-- backdrop -->
    <rect width="900" height="300" fill="#0d1117"/>
    <rect width="900" height="300" fill="url(#dots)"/>
    <ellipse cx="740" cy="150" rx="260" ry="220" fill="url(#softGlow)"/>

    <!-- faint static watermark -->
    <text x="770" y="195" text-anchor="middle" font-family="'Courier New', monospace" font-size="130" font-weight="700" fill="#161d27">&lt;/&gt;</text>

    <!-- kicker -->
    <text x="72" y="78" font-family="'Courier New', monospace" font-size="15" letter-spacing="5" fill="#8b949e" opacity="0">
      &gt; HELLO, I'M
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.1s" fill="freeze"/>
    </text>

    <!-- name -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.3s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" dur="0.7s" begin="0.3s" fill="freeze"/>
      <text x="70" y="142" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#e6edf3">Youssef Al-Shwawra</text>
    </g>

    <!-- underline draws once -->
    <line x1="73" y1="160" x2="545" y2="160" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" stroke-dasharray="472" stroke-dashoffset="472">
      <animate attributeName="stroke-dashoffset" from="472" to="0" dur="1s" begin="0.7s" fill="freeze"/>
    </line>

    <!-- typed subtitle -->
    <g clip-path="url(#typeClip)">
      <text x="70" y="204" font-family="'Courier New', monospace" font-size="26" font-weight="700" fill="#58a6ff">Full-Stack Developer</text>
    </g>
    <rect x="70" y="182" width="2.5" height="28" fill="#58a6ff">
      <animate attributeName="x" values="70;390" dur="1.3s" begin="1.5s" fill="freeze" calcMode="linear"/>
      <animate attributeName="opacity" values="1;1;0;0;1;1" dur="1.1s" begin="2.8s" repeatCount="indefinite"/>
    </rect>

    <!-- university line -->
    <text x="72" y="236" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e" opacity="0">
      Software Engineering @ Al-Zaytoonah University of Jordan
      <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="2.6s" fill="freeze"/>
    </text>

    <!-- tech chips (fade in together, calmly) -->
    <g font-family="'Courier New', monospace" font-size="13" fill="#c9d1d9" text-anchor="middle" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="2.9s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" dur="0.7s" begin="2.9s" fill="freeze"/>
      <rect x="72" y="256" width="80" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
      <text x="112" y="273">Node.js</text>
      <rect x="160" y="256" width="92" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
      <text x="206" y="273">ASP.NET</text>
      <rect x="260" y="256" width="68" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
      <text x="294" y="273">React</text>
      <rect x="336" y="256" width="108" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
      <text x="390" y="273">SQL / NoSQL</text>
    </g>

    <!-- card border -->
    <rect x="0.5" y="0.5" width="899" height="299" rx="16" fill="none" stroke="#30363d" stroke-width="1.5"/>
  </g>
</svg>
