<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" fill="none" role="img" aria-label="Youssef Al-Shwawra — Full-Stack Developer">
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.3" fill="#1c2128"/>
    </pattern>

    <clipPath id="card"><rect x="0" y="0" width="900" height="250" rx="16"/></clipPath>
    <clipPath id="typeClip">
      <rect x="70" y="152" width="0" height="34">
        <animate attributeName="width" values="0;320" dur="1.3s" begin="1.5s" fill="freeze" calcMode="linear"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <!-- backdrop -->
    <rect width="900" height="250" fill="#0d1117"/>
    <rect width="900" height="250" fill="url(#dots)"/>

    <!-- kicker -->
    <text x="72" y="48" font-family="'Courier New', monospace" font-size="15" letter-spacing="5" fill="#8b949e" opacity="0">
      &gt; HELLO, I'M
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.1s" fill="freeze"/>
    </text>

    <!-- name -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.3s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" dur="0.7s" begin="0.3s" fill="freeze"/>
      <text x="70" y="112" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#e6edf3">Youssef Al-Shwawra</text>
    </g>

    <!-- underline draws once -->
    <line x1="73" y1="130" x2="545" y2="130" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" stroke-dasharray="472" stroke-dashoffset="472">
      <animate attributeName="stroke-dashoffset" from="472" to="0" dur="1s" begin="0.7s" fill="freeze"/>
    </line>

    <!-- typed subtitle -->
    <g clip-path="url(#typeClip)">
      <text x="70" y="174" font-family="'Courier New', monospace" font-size="26" font-weight="700" fill="#58a6ff">Full-Stack Developer</text>
    </g>
    <rect x="70" y="152" width="2.5" height="28" fill="#58a6ff">
      <animate attributeName="x" values="70;390" dur="1.3s" begin="1.5s" fill="freeze" calcMode="linear"/>
      <animate attributeName="opacity" values="1;1;0;0;1;1" dur="1.1s" begin="2.8s" repeatCount="indefinite"/>
    </rect>

    <!-- tagline -->
    <text x="72" y="206" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e" opacity="0">
      Building web apps end-to-end — backend, frontend &amp; DevOps
      <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="2.6s" fill="freeze"/>
    </text>

    <!-- card border -->
    <rect x="0.5" y="0.5" width="899" height="249" rx="16" fill="none" stroke="#30363d" stroke-width="1.5"/>
  </g>
</svg>
