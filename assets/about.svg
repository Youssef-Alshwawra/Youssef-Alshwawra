<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 196" width="900" height="196" fill="none" role="img" aria-label="About Youssef Al-Shwawra">
  <defs>
    <pattern id="ad" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.3" fill="#1c2128"/>
    </pattern>
    <linearGradient id="abar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="ac"><rect width="900" height="196" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#ac)" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <rect width="900" height="196" fill="#0d1117"/>
    <rect width="900" height="196" fill="url(#ad)"/>

    <!-- code watermark -->
    <text x="828" y="150" text-anchor="middle" font-family="'Courier New', monospace" font-size="120" font-weight="700" fill="#161b22" opacity="0.55">&lt;/&gt;</text>

    <!-- left accent rail -->
    <rect x="28" y="34" width="4" height="120" rx="2" fill="url(#abar)"/>

    <!-- kicker -->
    <text x="50" y="48" font-family="'Courier New', monospace" font-size="14" letter-spacing="4" fill="#8b949e" opacity="0">
      &gt; whoami
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.1s" fill="freeze"/>
    </text>

    <!-- paragraph -->
    <g font-size="16.5">
      <text x="50" y="86" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.25s" fill="freeze"/>
        <tspan fill="#e6edf3" font-weight="700">Full-Stack Web Developer</tspan><tspan fill="#c9d1d9"> building products end-to-end — from backend</tspan>
      </text>
      <text x="50" y="115" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.4s" fill="freeze"/>
        <tspan fill="#c9d1d9">APIs with </tspan><tspan fill="#58a6ff" font-weight="600">PHP</tspan><tspan fill="#c9d1d9"> / </tspan><tspan fill="#58a6ff" font-weight="600">Laravel</tspan><tspan fill="#c9d1d9"> &amp; </tspan><tspan fill="#58a6ff" font-weight="600">Node.js</tspan><tspan fill="#c9d1d9"> to modern </tspan><tspan fill="#58a6ff" font-weight="600">React</tspan><tspan fill="#c9d1d9"> &amp; </tspan><tspan fill="#58a6ff" font-weight="600">Next.js</tspan>
      </text>
      <text x="50" y="144" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.55s" fill="freeze"/>
        <tspan fill="#c9d1d9">frontends, shipped on </tspan><tspan fill="#58a6ff" font-weight="600">Docker</tspan><tspan fill="#c9d1d9"> &amp; </tspan><tspan fill="#58a6ff" font-weight="600">Ubuntu</tspan><tspan fill="#c9d1d9"> and backed by SQL &amp; NoSQL data.</tspan>
      </text>
    </g>

    <rect x="0.75" y="0.75" width="898.5" height="194.5" rx="16" fill="none" stroke="#30363d" stroke-width="1.5"/>
  </g>
</svg>
